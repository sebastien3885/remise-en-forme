# Mise en ligne sur GitHub Pages (chapitre 9).
#
# Chaque poussée sur `main` reconstruit et republie l'application, après les
# tests. Le bouton « Run workflow » de l'onglet Actions permet de republier à
# la main sans rien changer au code.
#
# Avant la première poussée, deux choses doivent être faites une fois pour
# toutes — elles sont détaillées dans docs/mise-en-ligne.md :
#
#   1. activer Pages : Réglages → Pages → Source : GitHub Actions ;
#   2. vérifier `NOM_DEPOT` dans vite.config.ts, qui fixe le chemin public.
#
# Sans la première, le travail `deployer` échoue avec un message explicite.

name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une mise en ligne à la fois, sans annuler celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Le build lance déjà le typecheck ; les tests restent un garde-fou
      # avant de publier quoi que ce soit.
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
